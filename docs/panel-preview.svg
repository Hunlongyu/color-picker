<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="357" height="209" viewBox="0 0 357 209" role="img" aria-labelledby="title desc">
  <title id="title">Color Picker</title>
  <desc id="desc">The Color Picker panel on a neutral background to make its rounded window corners visible.</desc>
  <defs>
    <!-- Match the 8 px window corners in src/panel.c; keep the original screenshot at 1:1 scale. -->
    <clipPath id="window-corners">
      <rect x="40" y="40" width="277" height="129" rx="8"/>
    </clipPath>
  </defs>
  <rect width="357" height="209" rx="12" fill="#e5e9ef"/>
  <image x="40" y="40" width="277" height="129" clip-path="url(#window-corners)" xlink:href="data:image/png;base64,"/>
</svg>
